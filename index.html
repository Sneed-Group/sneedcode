<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SneedCode</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --sidebar-bg: #252526;
            --editor-bg: #1e1e1e;
            --statusbar-bg: #007acc;
            --text-color: #d4d4d4;
            --border-color: #3c3c3c;
            --active-tab: #1e1e1e;
            --inactive-tab: #2d2d2d;
            --button-hover: #2a2d2e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .menubar {
            background-color: var(--bg-color);
            padding: 5px 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
        }

        .menu-item {
            margin-right: 15px;
            cursor: pointer;
            padding: 3px 5px;
            font-size: 13px;
        }

        .menu-item:hover {
            background-color: var(--button-hover);
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: var(--sidebar-bg);
            min-width: 160px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            z-index: 10;
            border: 1px solid var(--border-color);
        }

        .dropdown-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
        }

        .dropdown-item:hover {
            background-color: var(--button-hover);
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 200px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 10px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header button {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 16px;
        }

        .file-tree {
            padding: 10px;
        }

        .directory {
            margin-bottom: 5px;
            cursor: pointer;
        }

        .directory-name {
            display: flex;
            align-items: center;
            font-size: 13px;
            padding: 3px 0;
        }

        .directory-name:before {
            content: "📁";
            margin-right: 5px;
        }

        .directory.open .directory-name:before {
            content: "📂";
        }

        .directory-content {
            padding-left: 15px;
            display: none;
        }

        .directory.open .directory-content {
            display: block;
        }

        .file {
            margin: 2px 0;
            cursor: pointer;
            font-size: 13px;
            padding: 3px 0;
            display: flex;
            align-items: center;
        }

        .file:before {
            content: "📄";
            margin-right: 5px;
        }

        .file:hover, .directory-name:hover {
            background-color: var(--button-hover);
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            height: 35px;
            overflow-x: auto;
        }

        .tab {
            padding: 8px 15px;
            background-color: var(--inactive-tab);
            margin-right: 1px;
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 13px;
            user-select: none;
            max-width: 200px;
            min-width: 120px;
        }

        .tab.active {
            background-color: var(--active-tab);
            border-bottom: 1px solid var(--statusbar-bg);
        }

        .tab-close {
            margin-left: auto;
            font-size: 12px;
            opacity: 0.7;
        }

        .tab-close:hover {
            opacity: 1;
        }

        .editor {
            flex: 1;
            background-color: var(--editor-bg);
            position: relative;
            overflow: hidden;
        }

        .editor textarea {
            width: 100%;
            height: 100%;
            background-color: var(--editor-bg);
            color: var(--text-color);
            border: none;
            resize: none;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            outline: none;
            tab-size: 4;
        }

        .status-bar {
            height: 22px;
            background-color: var(--statusbar-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 12px;
        }

        .status-item {
            margin-right: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--sidebar-bg);
            padding: 20px;
            border-radius: 5px;
            width: 400px;
            max-width: 90%;
        }

        .modal-header {
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .modal-body {
            margin-bottom: 15px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        button {
            padding: 8px 12px;
            background-color: var(--statusbar-bg);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button.secondary {
            background-color: #3c3c3c;
        }

        /* Plugin panel */
        .plugin-panel {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 300px;
            background-color: var(--sidebar-bg);
            border-left: 1px solid var(--border-color);
            display: none;
            flex-direction: column;
            z-index: 5;
        }

        .plugin-header {
            padding: 10px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .plugin-content {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .plugin-item {
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .plugin-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .plugin-description {
            font-size: 12px;
            color: #a0a0a0;
            margin-bottom: 5px;
        }

        .plugin-actions {
            display: flex;
            justify-content: flex-end;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--statusbar-bg);
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
            z-index: 1000;
            display: none;
            animation: fadeInOut 3s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }

        .line-numbers {
            position: absolute;
            top: 0;
            left: 0;
            width: 40px;
            height: 100%;
            background-color: var(--bg-color);
            border-right: 1px solid var(--border-color);
            text-align: right;
            padding: 10px 5px 10px 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            color: #6e6e6e;
            overflow: hidden;
            user-select: none;
        }

        .editor-content {
            margin-left: 40px;
            width: calc(100% - 40px);
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="menubar">
        <div class="dropdown">
            <div class="menu-item">File</div>
            <div class="dropdown-content">
                <div class="dropdown-item" id="new-file">New File</div>
                <div class="dropdown-item" id="open-file">Open File...</div>
                <div class="dropdown-item" id="open-folder">Open Folder...</div>
                <div class="dropdown-item" id="save-file">Save</div>
                <div class="dropdown-item" id="save-as">Save As...</div>
            </div>
        </div>
        <div class="dropdown">
            <div class="menu-item">Edit</div>
            <div class="dropdown-content">
                <div class="dropdown-item" id="undo">Undo</div>
                <div class="dropdown-item" id="redo">Redo</div>
                <div class="dropdown-item" id="cut">Cut</div>
                <div class="dropdown-item" id="copy">Copy</div>
                <div class="dropdown-item" id="paste">Paste</div>
            </div>
        </div>
        <div class="dropdown">
            <div class="menu-item">View</div>
            <div class="dropdown-content">
                <div class="dropdown-item" id="toggle-sidebar">Toggle Sidebar</div>
                <div class="dropdown-item" id="toggle-plugins">Plugins</div>
            </div>
        </div>
        <div class="dropdown">
            <div class="menu-item">Help</div>
            <div class="dropdown-content">
                <div class="dropdown-item" id="about">About</div>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header">
                EXPLORER
                <button id="new-file-btn">+</button>
            </div>
            <div class="file-tree" id="file-tree"></div>
        </div>

        <div class="editor-container">
            <div class="tabs" id="tabs"></div>
            <div class="editor" id="editor">
                <div class="line-numbers" id="line-numbers"></div>
                <div class="editor-content">
                    <textarea id="editor-textarea" spellcheck="false"></textarea>
                </div>
            </div>
            <div class="plugin-panel" id="plugin-panel">
                <div class="plugin-header">
                    Plugins
                    <button id="close-plugins">×</button>
                </div>
                <div class="plugin-content" id="plugin-list"></div>
            </div>
            <div class="status-bar">
                <div class="status-left">
                    <span class="status-item" id="line-col">Ln 1, Col 1</span>
                    <span class="status-item" id="file-type">Plain Text</span>
                </div>
                <div class="status-right">
                    <span class="status-item" id="encoding">UTF-8</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Save As Modal -->
    <div class="modal" id="save-as-modal">
        <div class="modal-content">
            <div class="modal-header">Save As</div>
            <div class="modal-body">
                <input type="text" id="save-filename" placeholder="Enter filename">
            </div>
            <div class="modal-footer">
                <button class="secondary" id="save-as-cancel">Cancel</button>
                <button id="save-as-confirm">Save</button>
            </div>
        </div>
    </div>

    <!-- New File Modal -->
    <div class="modal" id="new-file-modal">
        <div class="modal-content">
            <div class="modal-header">New File</div>
            <div class="modal-body">
                <input type="text" id="new-filename" placeholder="Enter filename">
            </div>
            <div class="modal-footer">
                <button class="secondary" id="new-file-cancel">Cancel</button>
                <button id="new-file-confirm">Create</button>
            </div>
        </div>
    </div>
    
    <!-- Install Plugin Modal -->
    <div class="modal" id="install-plugin-modal">
        <div class="modal-content">
            <div class="modal-header">Install Plugin</div>
            <div class="modal-body">
                <input type="file" id="plugin-file" accept=".js">
                <div id="plugin-validation-message" style="color: #ff6b6b; margin-top: 10px;"></div>
            </div>
            <div class="modal-footer">
                <button class="secondary" id="install-plugin-cancel">Cancel</button>
                <button id="install-plugin-confirm">Install</button>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification"></div>

    <script>
        // Editor State
        const state = {
            files: {}, // filename -> content
            currentFile: null,
            openFiles: [], // {filename, modified}
            fileTree: {}, // path -> {type, children}
            history: {}, // filename -> {past: [], future: []}
            plugins: []
        };

        // DOM Elements
        const elements = {
            fileTree: document.getElementById('file-tree'),
            tabs: document.getElementById('tabs'),
            editor: document.getElementById('editor'),
            textarea: document.getElementById('editor-textarea'),
            lineNumbers: document.getElementById('line-numbers'),
            lineCol: document.getElementById('line-col'),
            fileType: document.getElementById('file-type'),
            saveAsModal: document.getElementById('save-as-modal'),
            saveFilename: document.getElementById('save-filename'),
            newFileModal: document.getElementById('new-file-modal'),
            newFilename: document.getElementById('new-filename'),
            notification: document.getElementById('notification'),
            pluginPanel: document.getElementById('plugin-panel'),
            pluginList: document.getElementById('plugin-list'),
            installPluginModal: document.getElementById('install-plugin-modal'),
            pluginFile: document.getElementById('plugin-file'),
            pluginValidationMessage: document.getElementById('plugin-validation-message')
        };

        // Event Listeners
        document.getElementById('new-file').addEventListener('click', () => openNewFileModal());
        document.getElementById('new-file-btn').addEventListener('click', () => openNewFileModal());
        document.getElementById('open-file').addEventListener('click', openFile);
        document.getElementById('open-folder').addEventListener('click', openFolder);
        document.getElementById('save-file').addEventListener('click', saveFile);
        document.getElementById('save-as').addEventListener('click', () => openSaveAsModal());
        document.getElementById('save-as-cancel').addEventListener('click', () => closeModal(elements.saveAsModal));
        document.getElementById('save-as-confirm').addEventListener('click', saveFileAs);
        document.getElementById('new-file-cancel').addEventListener('click', () => closeModal(elements.newFileModal));
        document.getElementById('new-file-confirm').addEventListener('click', createNewFile);
        document.getElementById('toggle-sidebar').addEventListener('click', toggleSidebar);
        document.getElementById('toggle-plugins').addEventListener('click', togglePlugins);
        document.getElementById('close-plugins').addEventListener('click', togglePlugins);
        document.getElementById('install-plugin-cancel').addEventListener('click', () => closeModal(elements.installPluginModal));
        document.getElementById('install-plugin-confirm').addEventListener('click', installPlugin);
        document.getElementById('about').addEventListener('click', () => alert("SneedCode - made with <3 by Sneed Group. Version 3.0"));

        // Initialize editor with line numbers
        elements.textarea.addEventListener('input', handleEditorInput);
        elements.textarea.addEventListener('keydown', handleEditorKeydown);
        elements.textarea.addEventListener('scroll', syncLineNumbersScroll);
        elements.textarea.addEventListener('click', updateCursorPosition);
        elements.textarea.addEventListener('keyup', updateCursorPosition);

        // Initialize the editor
        init();

        function init() {
            updateLineNumbers();
            updateCursorPosition();
            createDefaultStructure();
            // Add example plugin
            addBuiltInPlugins();
        }

        function createDefaultStructure() {
            // Create a default file structure
            state.fileTree = {
                '/': { type: 'directory', children: {
                    'src': { type: 'directory', children: {
                        'index.js': { type: 'file' },
                        'styles.css': { type: 'file' }
                    }},
                    'README.md': { type: 'file' }
                }}
            };
            
            // Add sample content to files
            state.files['src/index.js'] = 'console.log("Hello, world!");\n\n// Write your code here\n';
            state.files['src/styles.css'] = 'body {\n  font-family: sans-serif;\n  margin: 0;\n  padding: 20px;\n}\n';
            state.files['README.md'] = '# My Project\n\nWelcome to my awesome project!\n';
            
            renderFileTree();
        }

        function addBuiltInPlugins() {
            // Add some built-in plugins as examples
            const syntaxHighlighterPlugin = {
                name: 'Syntax Highlighter',
                description: 'Adds syntax highlighting for various programming languages',
                source: `
                    // Plugin: Syntax Highlighter
                    // Description: Adds syntax highlighting for various languages
                    
                    function initPlugin() {
                        console.log("Syntax Highlighter plugin loaded");
                        return {
                            name: "Syntax Highlighter",
                            description: "Highlights syntax for JavaScript, HTML, CSS, and more",
                            version: "1.0.0",
                            onTextChange: function(text, filename) {
                                // This is where the highlighting logic would be implemented
                                console.log("Highlighting file: " + filename);
                                return text; // Return unmodified text for now
                            }
                        };
                    }
                    
                    initPlugin();
                `,
                active: true
            };
            
            const autoIndentPlugin = {
                name: 'Auto Indent',
                description: 'Automatically indents code as you type',
                source: `
                    // Plugin: Auto Indent
                    // Description: Automatically indents code
                    
                    function initPlugin() {
                        console.log("Auto Indent plugin loaded");
                        return {
                            name: "Auto Indent",
                            description: "Automatically indents your code",
                            version: "1.0.0",
                            onKeyPress: function(key, text) {
                                if (key === "Enter") {
                                    // Logic to determine indentation level
                                    console.log("Auto indenting after Enter key");
                                }
                                return null; // Return null to let editor handle default behavior
                            }
                        };
                    }
                    
                    initPlugin();
                `,
                active: false
            };
            
            state.plugins.push(syntaxHighlighterPlugin, autoIndentPlugin);
            renderPluginList();
        }

        function openFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const filename = file.name;
                        state.files[filename] = e.target.result;
                        openFileInEditor(filename);
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

        function openFolder() {
            const input = document.createElement('input');
            input.type = 'file';
            input.webkitdirectory = true;
            input.onchange = (event) => {
                const files = event.target.files;
                if (files.length > 0) {
                    const rootFolder = files[0].webkitRelativePath.split('/')[0];
                    
                    // Reset file tree and create root
                    state.fileTree = {
                        '/': { type: 'directory', children: {
                            [rootFolder]: { type: 'directory', children: {} }
                        }}
                    };
                    
                    // Process each file
                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        const path = file.webkitRelativePath;
                        const pathParts = path.split('/');
                        
                        // Create directory structure
                        let currentLevel = state.fileTree['/'].children;
                        for (let j = 1; j < pathParts.length; j++) {
                            const part = pathParts[j];
                            
                            if (j === pathParts.length - 1) {
                                // This is a file
                                currentLevel[part] = { type: 'file' };
                                
                                // Load file content
                                const reader = new FileReader();
                                reader.onload = (function(filename) {
                                    return function(e) {
                                        state.files[path] = e.target.result;
                                    };
                                })(path);
                                reader.readAsText(file);
                            } else {
                                // This is a directory
                                if (!currentLevel[part]) {
                                    currentLevel[part] = { type: 'directory', children: {} };
                                }
                                currentLevel = currentLevel[part].children;
                            }
                        }
                    }
                    
                    renderFileTree();
                    showNotification(`Opened folder: ${rootFolder}`);
                }
            };
            input.click();
        }

        function openNewFileModal() {
            elements.newFilename.value = '';
            openModal(elements.newFileModal);
            elements.newFilename.focus();
        }

        function createNewFile() {
            const filename = elements.newFilename.value.trim();
            if (filename) {
                state.files[filename] = '';
                openFileInEditor(filename);
                closeModal(elements.newFileModal);
                
                // Add to file tree
                state.fileTree['/'].children[filename] = { type: 'file' };
                renderFileTree();
            }
        }

        function saveFile() {
            if (!state.currentFile) {
                openSaveAsModal();
                return;
            }
            
            // In a browser environment, we trigger a download
            const content = elements.textarea.value;
            downloadFile(state.currentFile, content);
            
            // Mark as saved
            updateFileState(state.currentFile, content, false);
            showNotification(`File saved: ${state.currentFile}`);
        }

        function openSaveAsModal() {
            elements.saveFilename.value = state.currentFile || '';
            openModal(elements.saveAsModal);
            elements.saveFilename.focus();
        }

        function saveFileAs() {
            const filename = elements.saveFilename.value.trim();
            if (filename) {
                const content = elements.textarea.value;
                state.files[filename] = content;
                
                // Download file
                downloadFile(filename, content);
                
                // Update UI
                closeModal(elements.saveAsModal);
                state.currentFile = filename;
                updateFileState(filename, content, false);
                
                // If this is a new file, add to the file tree
                if (!findNodeInFileTree(filename)) {
                    state.fileTree['/'].children[filename] = { type: 'file' };
                    renderFileTree();
                }
                
                showNotification(`File saved as: ${filename}`);
            }
        }

        function findNodeInFileTree(path) {
            const parts = path.split('/');
            let current = state.fileTree['/'].children;
            
            for (let i = 0; i < parts.length; i++) {
                if (!current[parts[i]]) {
                    return null;
                }
                if (i === parts.length - 1) {
                    return current[parts[i]];
                }
                current = current[parts[i]].children;
            }
            return null;
        }

        function downloadFile(filename, content) {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function openFileInEditor(filename) {
            if (!isFileOpen(filename)) {
                state.openFiles.push({
                    filename,
                    modified: false
                });
            }
            
            state.currentFile = filename;
            elements.textarea.value = state.files[filename] || '';
            updateLineNumbers();
            renderTabs();
            detectFileType(filename);
            
            // Initialize history for this file if needed
            if (!state.history[filename]) {
                state.history[filename] = {
                    past: [],
                    future: []
                };
            }
        }

        function isFileOpen(filename) {
            return state.openFiles.some(file => file.filename === filename);
        }

        function detectFileType(filename) {
            const extension = filename.split('.').pop().toLowerCase();
            let fileType = 'Plain Text';
            
            switch (extension) {
                case 'js':
                    fileType = 'JavaScript';
                    break;
                case 'html':
                    fileType = 'HTML';
                    break;
                case 'css':
                    fileType = 'CSS';
                    break;
                case 'json':
                    fileType = 'JSON';
                    break;
                case 'md':
                    fileType = 'Markdown';
                    break;
                case 'py':
                    fileType = 'Python';
                    break;
                case 'java':
                    fileType = 'Java';
                    break;
                case 'php':
                    fileType = 'PHP';
                    break;
            }
            
            elements.fileType.textContent = fileType;
        }

        function updateFileState(filename, content, modified) {
            state.files[filename] = content;
            
            // Update open files array
            for (let i = 0; i < state.openFiles.length; i++) {
                if (state.openFiles[i].filename === filename) {
                    state.openFiles[i].modified = modified;
                    break;
                }
            }
            
            renderTabs();
        }
